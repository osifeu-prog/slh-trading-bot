version: "3.8"

services:
  api:
    build: .
    container_name: slh_api
    ports:
      - "8080:8080"
    volumes:
      - shared_data:/shared_data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: slh_frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  trader:
    build: .
    container_name: slh_trader
    command: python run_trader.py
    volumes:
      - shared_data:/shared_data
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

  supervisor:
    build: .
    container_name: slh_supervisor
    command: python supervisor_app.py
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

  watchdog:
    build: ./watchdog
    container_name: slh_watchdog
    volumes:
      - shared_data:/shared_data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: slh_db
    environment:
      POSTGRES_USER: slh
      POSTGRES_PASSWORD: slh_pass
      POSTGRES_DB: slh_trading
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  shared_data:
  pgdata:
